<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ISC2 CC - Dominios</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #eef3f8;
        --text: #1c2430;
        --muted: #647084;
        --line: #d7dee8;
        --accent: #176b87;
        --accent-strong: #0d5268;
        --focus: #ef8a17;
        --shadow: 0 18px 45px rgba(28, 36, 48, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      button,
      input {
        font: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: #ffffff;
        padding: 24px 18px;
      }

      .brand {
        margin: 0 0 18px;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      .domain-menu {
        display: grid;
        gap: 8px;
      }

      .domain-button {
        width: 100%;
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        padding: 10px 12px;
        text-align: left;
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .domain-button:hover,
      .domain-button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .domain-button.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .domain-number {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .domain-title {
        display: block;
        margin-top: 2px;
        font-weight: 700;
      }

      .toc {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .toc-title {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .toc-list {
        display: grid;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc-list a {
        display: block;
        border-radius: 6px;
        color: var(--muted);
        padding: 6px 8px;
        text-decoration: none;
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .toc-list a:hover,
      .toc-list a:focus-visible {
        background: var(--panel-soft);
        color: var(--accent-strong);
        outline: none;
      }

      .main {
        min-width: 0;
        padding: 30px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin: -30px -30px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(245, 247, 251, 0.94);
        padding: 18px 30px;
        backdrop-filter: blur(12px);
      }

      .search {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--text);
        padding: 0 12px;
      }

      .search:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(23, 107, 135, 0.16);
      }

      .action-button {
        min-height: 42px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: #ffffff;
        color: var(--accent-strong);
        cursor: pointer;
        font-weight: 700;
        padding: 0 14px;
      }

      .action-button:hover,
      .action-button:focus-visible {
        background: var(--accent);
        color: #ffffff;
        outline: none;
      }

      .content-panel {
        max-width: 980px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .domain-header {
        border-bottom: 1px solid var(--line);
        padding: 28px 34px 22px;
      }

      .domain-header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.75rem);
        line-height: 1.1;
      }

      .domain-meta {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .document {
        padding: 10px 34px 42px;
      }

      .lesson {
        padding-top: 24px;
        scroll-margin-top: 88px;
      }

      .lesson + .lesson {
        margin-top: 18px;
        border-top: 1px solid var(--line);
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5 {
        line-height: 1.25;
      }

      .markdown h1 {
        margin: 0 0 16px;
        color: var(--accent-strong);
        font-size: 1.75rem;
      }

      .markdown h2 {
        margin: 28px 0 12px;
        font-size: 1.45rem;
      }

      .markdown h3 {
        margin: 24px 0 10px;
        font-size: 1.18rem;
      }

      .markdown h4,
      .markdown h5 {
        margin: 18px 0 8px;
        font-size: 1rem;
      }

      .markdown p {
        margin: 0 0 14px;
      }

      .markdown ul {
        margin: 0 0 16px 22px;
        padding: 0;
      }

      .markdown li + li {
        margin-top: 6px;
      }

      .markdown img {
        display: block;
        max-width: min(100%, 760px);
        height: auto;
        margin: 18px auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
      }

      .markdown code {
        border-radius: 4px;
        background: var(--panel-soft);
        padding: 0.08em 0.28em;
      }

      .empty-state,
      .error-state,
      .loading-state {
        padding: 44px 34px;
        color: var(--muted);
      }

      mark {
        border-radius: 3px;
        background: rgba(239, 138, 23, 0.24);
        color: inherit;
        padding: 0 2px;
      }

      @media (max-width: 920px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .domain-menu {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toc {
          display: none;
        }

        .main {
          padding: 18px;
        }

        .toolbar {
          margin: -18px -18px 18px;
          padding: 14px 18px;
        }

        .domain-header,
        .document {
          padding-left: 20px;
          padding-right: 20px;
        }
      }

      @media (max-width: 560px) {
        .domain-menu,
        .toolbar {
          grid-template-columns: 1fr;
        }

        .action-button {
          width: 100%;
        }
      }

      @media print {
        .sidebar,
        .toolbar {
          display: none;
        }

        .app-shell {
          display: block;
        }

        .main {
          padding: 0;
        }

        .content-panel {
          border: 0;
          box-shadow: none;
        }

        .lesson {
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Menu de dominios">
        <h1 class="brand">ISC2 CC</h1>
        <nav id="domainMenu" class="domain-menu" aria-label="Dominios"></nav>
        <section class="toc" aria-label="Indice del dominio">
          <p class="toc-title">Indice</p>
          <ol id="tocList" class="toc-list"></ol>
        </section>
      </aside>

      <main class="main">
        <div class="toolbar">
          <input id="searchInput" class="search" type="search" placeholder="Buscar en el dominio actual" autocomplete="off">
          <button id="printButton" class="action-button" type="button">Imprimir</button>
        </div>

        <section id="content" class="content-panel" aria-live="polite">
          <div class="empty-state">Selecciona un dominio para ver el contenido completo.</div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
