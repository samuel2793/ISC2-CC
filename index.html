<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ISC2 CC - Dominios</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #eef3f8;
        --text: #1c2430;
        --muted: #647084;
        --line: #d7dee8;
        --accent: #176b87;
        --accent-strong: #0d5268;
        --focus: #ef8a17;
        --shadow: 0 18px 45px rgba(28, 36, 48, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      button,
      input {
        font: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: #ffffff;
        padding: 24px 18px;
      }

      .brand {
        margin: 0 0 18px;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      .domain-menu {
        display: grid;
        gap: 8px;
      }

      .sidebar-section {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .domain-button {
        width: 100%;
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        padding: 10px 12px;
        text-align: left;
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .sidebar-action {
        display: block;
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
        padding: 10px 12px;
        text-align: left;
      }

      .domain-button:hover,
      .domain-button:focus-visible,
      .sidebar-action:hover,
      .sidebar-action:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .domain-button.active,
      .sidebar-action.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .domain-number {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .domain-title {
        display: block;
        margin-top: 2px;
        font-weight: 700;
      }

      .toc {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .toc-title {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .toc-list {
        display: grid;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc-list a {
        display: block;
        border-radius: 6px;
        color: var(--muted);
        padding: 6px 8px;
        text-decoration: none;
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .toc-list a:hover,
      .toc-list a:focus-visible {
        background: var(--panel-soft);
        color: var(--accent-strong);
        outline: none;
      }

      .main {
        min-width: 0;
        padding: 30px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        margin: -30px -30px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(245, 247, 251, 0.94);
        padding: 18px 30px;
        backdrop-filter: blur(12px);
      }

      .search {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--text);
        padding: 0 12px;
      }

      .search:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(23, 107, 135, 0.16);
      }

      .action-button {
        min-height: 42px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: #ffffff;
        color: var(--accent-strong);
        cursor: pointer;
        font-weight: 700;
        padding: 0 14px;
      }

      .action-button:hover,
      .action-button:focus-visible {
        background: var(--accent);
        color: #ffffff;
        outline: none;
      }

      .action-button:disabled {
        border-color: var(--line);
        background: var(--panel-soft);
        color: var(--muted);
        cursor: wait;
      }

      .content-panel {
        max-width: 980px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .domain-header {
        border-bottom: 1px solid var(--line);
        padding: 28px 34px 22px;
      }

      .domain-header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.75rem);
        line-height: 1.1;
      }

      .domain-meta {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .document {
        padding: 10px 34px 42px;
      }

      .lesson {
        padding-top: 24px;
        scroll-margin-top: 88px;
      }

      .lesson + .lesson {
        margin-top: 18px;
        border-top: 1px solid var(--line);
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5 {
        line-height: 1.25;
      }

      .markdown h1 {
        margin: 0 0 16px;
        color: var(--accent-strong);
        font-size: 1.75rem;
      }

      .markdown h2 {
        margin: 28px 0 12px;
        font-size: 1.45rem;
      }

      .markdown h3 {
        margin: 24px 0 10px;
        font-size: 1.18rem;
      }

      .markdown h4,
      .markdown h5 {
        margin: 18px 0 8px;
        font-size: 1rem;
      }

      .markdown p {
        margin: 0 0 14px;
      }

      .markdown ul {
        margin: 0 0 16px 22px;
        padding: 0;
      }

      .markdown li + li {
        margin-top: 6px;
      }

      .markdown img {
        display: block;
        max-width: min(100%, 760px);
        height: auto;
        margin: 18px auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
      }

      .markdown code {
        border-radius: 4px;
        background: var(--panel-soft);
        padding: 0.08em 0.28em;
      }

      .empty-state,
      .error-state,
      .loading-state {
        padding: 44px 34px;
        color: var(--muted);
      }

      .test-panel {
        display: grid;
        gap: 22px;
        padding: 30px 34px 42px;
      }

      .test-shell {
        display: grid;
        gap: 22px;
      }

      .test-intro {
        display: grid;
        gap: 16px;
        border: 1px solid #dce5ee;
        border-radius: 8px;
        background:
          radial-gradient(circle at top right, rgba(23, 107, 135, 0.12), transparent 34%),
          linear-gradient(180deg, #fbfdff 0%, #f2f7fb 100%);
        padding: 22px;
      }

      .test-header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        line-height: 1.1;
      }

      .test-header p,
      .test-meta {
        color: var(--muted);
        margin: 8px 0 0;
      }

      .test-controls {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr);
        gap: 16px;
        align-items: start;
      }

      .field-label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .battery-picker {
        display: grid;
        gap: 8px;
        max-height: 280px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
        padding: 10px;
      }

      .battery-option {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
        transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      }

      .battery-option:hover {
        border-color: #a8c4d0;
        box-shadow: 0 10px 24px rgba(23, 107, 135, 0.08);
        transform: translateY(-1px);
      }

      .battery-option input {
        margin-top: 4px;
      }

      .battery-option-title {
        display: block;
        font-weight: 800;
      }

      .battery-option-meta {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .battery-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .battery-toggle {
        min-height: 36px;
        border: 1px solid #b7ced8;
        border-radius: 999px;
        background: #ffffff;
        color: var(--accent-strong);
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 800;
        padding: 0 14px;
      }

      .battery-toggle:hover,
      .battery-toggle:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .test-sidecard {
        display: grid;
        gap: 14px;
        border: 1px solid #dce5ee;
        border-radius: 8px;
        background: #fbfdff;
        padding: 16px;
      }

      .test-sidecard-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
      }

      .test-sidecard-copy {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .test-sidecard-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .test-stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 10px 12px;
      }

      .test-stat-value {
        display: block;
        color: var(--accent-strong);
        font-size: 1.1rem;
        font-weight: 800;
        line-height: 1.1;
      }

      .test-stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 4px;
      }

      .test-official-note {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
        padding-top: 12px;
      }

      .test-stage {
        display: grid;
        gap: 16px;
      }

      .test-meta-card {
        display: grid;
        gap: 12px;
        border: 1px solid #dce5ee;
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
        padding: 18px;
      }

      .test-meta-topline {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .test-badge {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid #b7ced8;
        border-radius: 999px;
        background: #ffffff;
        color: var(--accent-strong);
        font-size: 0.84rem;
        font-weight: 800;
        padding: 0 12px;
      }

      .test-badge.success {
        border-color: #91c7a7;
        color: #206342;
        background: #eefaf2;
      }

      .test-badge.error {
        border-color: #e0a0a0;
        color: #8e2f2f;
        background: #fff2f2;
      }

      .test-battery-title {
        margin: 0;
        font-size: clamp(1.3rem, 2vw, 1.7rem);
        line-height: 1.2;
      }

      .test-battery-copy {
        color: var(--muted);
        margin: 0;
      }

      .test-score-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .test-progress {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        align-items: center;
        border-radius: 8px;
        background: linear-gradient(90deg, #edf6fb 0%, #f7fbfd 100%);
        color: var(--accent-strong);
        font-weight: 800;
        margin: 0;
        padding: 12px 14px;
      }

      .test-progress-meter {
        overflow: hidden;
        position: relative;
        height: 8px;
        border-radius: 999px;
        background: #d8e7ef;
      }

      .test-progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #176b87 0%, #2b8cad 100%);
      }

      .question-card {
        border: 1px solid #dce5ee;
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
        padding: 22px;
        box-shadow: 0 14px 36px rgba(20, 44, 66, 0.08);
      }

      .question-card.correct {
        border-color: #78b892;
        background: linear-gradient(180deg, #ffffff 0%, #f1fbf5 100%);
      }

      .question-card.incorrect {
        border-color: #d48b8b;
        background: linear-gradient(180deg, #ffffff 0%, #fff3f3 100%);
      }

      .question-title {
        margin: 0 0 16px;
        font-size: clamp(1.15rem, 1.7vw, 1.4rem);
        font-weight: 800;
        line-height: 1.35;
      }

      .option-list {
        display: grid;
        gap: 10px;
      }

      .option-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        cursor: pointer;
        padding: 12px;
        transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      }

      .option-item:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 20px rgba(23, 107, 135, 0.08);
        transform: translateY(-1px);
      }

      .option-item.correct {
        border-color: #2f8f5b;
        background: #e8f7ee;
      }

      .option-item.incorrect {
        border-color: #c45151;
        background: #ffecec;
      }

      .option-item:has(input:disabled) {
        cursor: default;
      }

      .option-item input {
        margin-top: 5px;
      }

      .question-feedback {
        margin: 14px 0 0;
        border-top: 1px solid rgba(28, 36, 48, 0.08);
        color: var(--muted);
        padding-top: 14px;
      }

      .score-box {
        border: 1px solid #b7ced8;
        border-radius: 8px;
        background: linear-gradient(180deg, #edf6fb 0%, #ffffff 100%);
        color: var(--accent-strong);
        font-size: 1.05rem;
        font-weight: 800;
        padding: 14px;
      }

      .test-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 16px;
      }

      mark {
        border-radius: 3px;
        background: rgba(239, 138, 23, 0.24);
        color: inherit;
        padding: 0 2px;
      }

      @media (max-width: 920px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .domain-menu {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toc {
          display: none;
        }

        .main {
          padding: 18px;
        }

        .toolbar {
          margin: -18px -18px 18px;
          padding: 14px 18px;
        }

        .domain-header,
        .document,
        .test-panel {
          padding-left: 20px;
          padding-right: 20px;
        }
      }

      @media (max-width: 560px) {
        .domain-menu,
        .toolbar,
        .test-controls {
          grid-template-columns: 1fr;
        }

        .test-progress {
          grid-template-columns: 1fr;
        }

        .test-sidecard-stats {
          grid-template-columns: 1fr 1fr;
        }

        .test-score-grid {
          grid-template-columns: 1fr 1fr;
        }

        .action-button {
          width: 100%;
        }
      }

      @media print {
        .sidebar,
        .toolbar {
          display: none;
        }

        .app-shell {
          display: block;
        }

        .main {
          padding: 0;
        }

        .content-panel {
          border: 0;
          box-shadow: none;
        }

        .lesson {
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Menu de dominios">
        <h1 class="brand">ISC2 CC</h1>
        <nav id="domainMenu" class="domain-menu" aria-label="Dominios"></nav>
        <div class="sidebar-section">
          <button id="testMenuButton" class="sidebar-action" type="button">Tests</button>
        </div>
        <section class="toc" aria-label="Indice del dominio">
          <p class="toc-title">Indice</p>
          <ol id="tocList" class="toc-list"></ol>
        </section>
      </aside>

      <main class="main">
        <div class="toolbar">
          <input id="searchInput" class="search" type="search" placeholder="Buscar en el dominio actual" autocomplete="off">
          <button id="epubButton" class="action-button" type="button">EPUB completo</button>
          <button id="printButton" class="action-button" type="button">Imprimir</button>
        </div>

        <section id="content" class="content-panel" aria-live="polite">
          <div class="empty-state">Selecciona un dominio para ver el contenido completo.</div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
