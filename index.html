<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ISC2 CC - Dominios</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #eef3f8;
        --text: #1c2430;
        --muted: #647084;
        --line: #d7dee8;
        --accent: #176b87;
        --accent-strong: #0d5268;
        --focus: #ef8a17;
        --shadow: 0 18px 45px rgba(28, 36, 48, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      button,
      input {
        font: inherit;
      }

      body.menu-open {
        overflow: hidden;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: 100vh;
      }

      .menu-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--accent-strong);
        cursor: pointer;
      }

      .menu-toggle:hover,
      .menu-toggle:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .menu-toggle-lines,
      .menu-toggle-lines::before,
      .menu-toggle-lines::after {
        display: block;
        width: 18px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
      }

      .menu-toggle-lines {
        position: relative;
      }

      .menu-toggle-lines::before,
      .menu-toggle-lines::after {
        content: "";
        position: absolute;
        left: 0;
      }

      .menu-toggle-lines::before {
        top: -6px;
      }

      .menu-toggle-lines::after {
        top: 6px;
      }

      .menu-backdrop {
        display: none;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: #ffffff;
        padding: 24px 18px;
      }

      .brand {
        margin: 0 0 18px;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      .domain-menu {
        display: grid;
        gap: 8px;
      }

      .sidebar-section {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .domain-button {
        width: 100%;
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        padding: 10px 12px;
        text-align: left;
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .sidebar-action {
        display: block;
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
        padding: 10px 12px;
        text-align: left;
      }

      .domain-button:hover,
      .domain-button:focus-visible,
      .sidebar-action:hover,
      .sidebar-action:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .domain-button.active,
      .sidebar-action.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .domain-number {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .domain-title {
        display: block;
        margin-top: 2px;
        font-weight: 700;
      }

      .toc {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .toc-title {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .toc-list {
        display: grid;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc-list a {
        display: block;
        border-radius: 6px;
        color: var(--muted);
        padding: 6px 8px;
        text-decoration: none;
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .toc-list a:hover,
      .toc-list a:focus-visible {
        background: var(--panel-soft);
        color: var(--accent-strong);
        outline: none;
      }

      .main {
        min-width: 0;
        padding: 30px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        margin: -30px -30px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(245, 247, 251, 0.94);
        padding: 18px 30px;
        backdrop-filter: blur(12px);
      }

      .search {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--text);
        padding: 0 12px;
      }

      .search:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(23, 107, 135, 0.16);
      }

      .action-button {
        min-height: 42px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: #ffffff;
        color: var(--accent-strong);
        cursor: pointer;
        font-weight: 700;
        padding: 0 14px;
      }

      .action-button:hover,
      .action-button:focus-visible {
        background: var(--accent);
        color: #ffffff;
        outline: none;
      }

      .action-button:disabled {
        border-color: var(--line);
        background: var(--panel-soft);
        color: var(--muted);
        cursor: wait;
      }

      .content-panel {
        max-width: 980px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .domain-header {
        border-bottom: 1px solid var(--line);
        padding: 28px 34px 22px;
      }

      .domain-header h1 {
        margin: 0;
        font-size: 2.5rem;
        line-height: 1.1;
      }

      .domain-meta {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .document {
        padding: 10px 34px 42px;
      }

      .lesson {
        padding-top: 24px;
        scroll-margin-top: 88px;
      }

      .lesson + .lesson {
        margin-top: 18px;
        border-top: 1px solid var(--line);
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4,
      .markdown h5 {
        line-height: 1.25;
      }

      .markdown h1 {
        margin: 0 0 16px;
        color: var(--accent-strong);
        font-size: 1.75rem;
      }

      .markdown h2 {
        margin: 28px 0 12px;
        font-size: 1.45rem;
      }

      .markdown h3 {
        margin: 24px 0 10px;
        font-size: 1.18rem;
      }

      .markdown h4,
      .markdown h5 {
        margin: 18px 0 8px;
        font-size: 1rem;
      }

      .markdown p {
        margin: 0 0 14px;
      }

      .markdown ul {
        margin: 0 0 16px 22px;
        padding: 0;
      }

      .markdown li + li {
        margin-top: 6px;
      }

      .markdown img {
        display: block;
        max-width: min(100%, 760px);
        height: auto;
        margin: 18px auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
      }

      .markdown .lesson-video {
        display: block;
        width: min(100%, 920px);
        height: auto;
        margin: 18px auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #000;
      }

      .markdown code {
        border-radius: 4px;
        background: var(--panel-soft);
        padding: 0.08em 0.28em;
      }

      .empty-state,
      .error-state,
      .loading-state {
        padding: 44px 34px;
        color: var(--muted);
      }

      .test-panel {
        padding: 30px 34px 42px;
      }

      .test-shell {
        display: grid;
        gap: 20px;
      }

      .test-topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 22px;
        align-items: start;
        border: 1px solid #d8e0e8;
        border-radius: 8px;
        background:
          radial-gradient(circle at top right, rgba(23, 107, 135, 0.16), transparent 34%),
          linear-gradient(180deg, #ffffff 0%, #f3f8fb 100%);
        padding: 28px;
        box-shadow: 0 18px 42px rgba(20, 44, 66, 0.08);
      }

      .test-heading {
        display: grid;
        gap: 10px;
        max-width: 660px;
      }

      .test-kicker {
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .test-heading h1 {
        margin: 0;
        font-size: 3rem;
        line-height: 0.95;
      }

      .test-heading p,
      .test-meta {
        color: var(--muted);
        margin: 0;
      }

      .test-selector {
        display: grid;
        gap: 12px;
        justify-items: end;
        align-self: stretch;
      }

      .field-label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .battery-picker-wrap {
        position: relative;
        width: min(400px, 100%);
      }

      .battery-picker-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        min-height: 52px;
        border: 1px solid #acc0cb;
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #f9fcfe 100%);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
        padding: 0 18px;
        text-align: left;
        box-shadow: 0 10px 24px rgba(23, 107, 135, 0.08);
      }

      .battery-picker-trigger:hover,
      .battery-picker-trigger:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 14px 28px rgba(23, 107, 135, 0.12);
        outline: none;
      }

      .battery-picker-summary {
        min-width: 0;
      }

      .battery-picker-caption {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .battery-picker-value {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .battery-picker-chevron {
        flex: 0 0 auto;
        color: var(--accent-strong);
        font-size: 1rem;
      }

      .battery-picker-popover {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        z-index: 20;
        width: min(520px, 90vw);
        border: 1px solid #c8d4dc;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 30px 70px rgba(20, 44, 66, 0.18);
        padding: 16px;
      }

      .battery-picker-popover.open {
        display: grid;
        gap: 12px;
      }

      .battery-picker-head {
        display: grid;
        gap: 10px;
      }

      .battery-picker-headline {
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 800;
      }

      .battery-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .battery-toggle {
        min-height: 34px;
        border: 1px solid #c0cdd7;
        border-radius: 999px;
        background: #ffffff;
        color: var(--accent-strong);
        cursor: pointer;
        font-size: 0.84rem;
        font-weight: 800;
        padding: 0 14px;
      }

      .battery-toggle:hover,
      .battery-toggle:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .battery-picker {
        display: grid;
        gap: 12px;
        max-height: 360px;
        overflow-y: auto;
        border: 1px solid #e1e7ed;
        border-radius: 8px;
        background: #f8fbfd;
        padding: 10px;
      }

      .battery-group {
        display: grid;
        gap: 10px;
        border: 1px solid #dbe5ec;
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
      }

      .battery-group-header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: start;
        justify-content: space-between;
      }

      .battery-group-title {
        margin: 0;
        color: var(--text);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .battery-group-meta {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .battery-group-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .battery-group-toggle {
        min-height: 30px;
        border: 1px solid #c7d3db;
        border-radius: 999px;
        background: #f7fafc;
        color: var(--accent-strong);
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 800;
        padding: 0 10px;
      }

      .battery-group-toggle:hover,
      .battery-group-toggle:focus-visible {
        border-color: var(--accent);
        background: #ffffff;
        outline: none;
      }

      .battery-group-list {
        display: grid;
        gap: 8px;
      }

      .battery-option {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        border: 1px solid #dde5ec;
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
        transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      }

      .battery-option:hover {
        border-color: #96b8c8;
        box-shadow: 0 10px 20px rgba(23, 107, 135, 0.08);
        transform: translateY(-1px);
      }

      .battery-option input {
        margin-top: 4px;
      }

      .battery-option-title {
        display: block;
        font-weight: 800;
      }

      .battery-option-meta {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.35;
        margin-top: 3px;
      }

      .test-dashboard {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .test-stat {
        border: 1px solid #dce5ec;
        border-radius: 8px;
        background: #ffffff;
        padding: 14px;
      }

      .test-stat-emphasis {
        background: linear-gradient(180deg, #176b87 0%, #0f5d74 100%);
        border-color: #176b87;
      }

      .test-stat-emphasis .test-stat-value,
      .test-stat-emphasis .test-stat-label {
        color: #ffffff;
      }

      .test-stat-value {
        display: block;
        color: var(--accent-strong);
        font-size: 1.25rem;
        font-weight: 800;
        line-height: 1.1;
      }

      .test-stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 4px;
      }

      .test-official-note {
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
        margin: 0;
        padding: 0 2px;
      }

      .test-stage {
        display: grid;
        gap: 16px;
      }

      .test-statusbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .test-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 20px;
        align-items: start;
      }

      .test-score-panel {
        display: grid;
        gap: 12px;
        border: 1px solid #dce5ec;
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
        padding: 16px;
        position: sticky;
        top: 92px;
      }

      .test-score-panel-title {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 800;
      }

      .test-score-panel-copy {
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }

      .test-badge {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid #b7ced8;
        border-radius: 999px;
        background: #ffffff;
        color: var(--accent-strong);
        font-size: 0.84rem;
        font-weight: 800;
        padding: 0 12px;
      }

      .test-badge.success {
        border-color: #91c7a7;
        color: #206342;
        background: #eefaf2;
      }

      .test-badge.error {
        border-color: #e0a0a0;
        color: #8e2f2f;
        background: #fff2f2;
      }

      .test-progress {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
        border-radius: 8px;
        background: linear-gradient(90deg, #edf6fb 0%, #f7fbfd 100%);
        color: var(--accent-strong);
        font-weight: 800;
        margin: 0;
        padding: 12px 14px;
      }

      .test-progress-meter {
        overflow: hidden;
        position: relative;
        height: 8px;
        border-radius: 999px;
        background: #d8e7ef;
      }

      .test-progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #176b87 0%, #2b8cad 100%);
      }

      .question-card {
        border: 1px solid #dce5ee;
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
        padding: 24px;
        box-shadow: 0 18px 40px rgba(20, 44, 66, 0.08);
      }

      .question-card.correct {
        border-color: #78b892;
        background: linear-gradient(180deg, #ffffff 0%, #f1fbf5 100%);
      }

      .question-card.incorrect {
        border-color: #d48b8b;
        background: linear-gradient(180deg, #ffffff 0%, #fff3f3 100%);
      }

      .question-card-result {
        min-height: 100%;
      }

      .question-eyebrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }

      .question-chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border-radius: 999px;
        background: #e8f3f8;
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 800;
        padding: 0 10px;
      }

      .question-chip.muted {
        background: #f0f4f7;
        color: var(--muted);
      }

      .question-title {
        margin: 0 0 16px;
        font-size: 1.42rem;
        font-weight: 800;
        line-height: 1.35;
      }

      .option-list {
        display: grid;
        gap: 12px;
      }

      .option-item {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        cursor: pointer;
        padding: 14px;
        transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      }

      .option-item:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 20px rgba(23, 107, 135, 0.08);
        transform: translateY(-1px);
      }

      .option-item.correct {
        border-color: #2f8f5b;
        background: #e8f7ee;
      }

      .option-item.incorrect {
        border-color: #c45151;
        background: #ffecec;
      }

      .option-item:has(input:disabled) {
        cursor: default;
      }

      .option-item input {
        margin: 0;
      }

      .option-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #eef3f7;
        color: var(--accent-strong);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .option-copy {
        line-height: 1.45;
      }

      .question-feedback {
        margin: 14px 0 0;
        border-top: 1px solid rgba(28, 36, 48, 0.08);
        color: var(--muted);
        padding-top: 14px;
      }

      .score-box {
        border: 1px solid #b7ced8;
        border-radius: 8px;
        background: linear-gradient(180deg, #edf6fb 0%, #ffffff 100%);
        color: var(--accent-strong);
        font-size: 1.05rem;
        font-weight: 800;
        padding: 14px;
      }

      .test-stat-inline {
        padding: 12px 14px;
      }

      .test-stat-highlight {
        border-color: #9fc5d5;
        background: linear-gradient(180deg, #edf6fb 0%, #ffffff 100%);
      }

      .test-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 16px;
      }

      mark {
        border-radius: 3px;
        background: rgba(239, 138, 23, 0.24);
        color: inherit;
        padding: 0 2px;
      }

      @media (max-width: 920px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .menu-toggle {
          display: inline-flex;
        }

        .menu-backdrop {
          position: fixed;
          inset: 0;
          z-index: 20;
          border: 0;
          background: rgba(28, 36, 48, 0.42);
          cursor: pointer;
          padding: 0;
        }

        body.menu-open .menu-backdrop {
          display: block;
        }

        .sidebar {
          position: fixed;
          z-index: 30;
          top: 0;
          left: 0;
          width: min(320px, calc(100vw - 44px));
          height: 100dvh;
          max-height: none;
          border-right: 1px solid var(--line);
          border-bottom: 0;
          padding: 24px 18px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }

        body.menu-open .sidebar {
          transform: translateX(0);
        }

        .domain-menu {
          display: grid;
          gap: 8px;
        }

        .domain-button {
          min-height: 54px;
        }

        .domain-title {
          white-space: normal;
        }

        .sidebar-section {
          margin-top: 18px;
          padding-top: 18px;
        }

        .sidebar-action {
          min-height: 46px;
        }

        .toc {
          display: block;
        }

        .main {
          padding: 18px;
        }

        .toolbar {
          grid-template-columns: auto minmax(0, 1fr) auto auto;
          margin: -18px -18px 18px;
          padding: 14px 18px;
        }

        .content-panel {
          max-width: none;
        }

        .domain-header,
        .document,
        .test-panel {
          padding-left: 20px;
          padding-right: 20px;
        }

        .domain-header h1 {
          font-size: 2rem;
        }

        .test-heading h1 {
          font-size: 2.25rem;
        }

        .question-title {
          font-size: 1.28rem;
        }

        .lesson {
          scroll-margin-top: 88px;
        }

        .test-topbar,
        .test-main {
          grid-template-columns: 1fr;
        }

        .test-selector {
          justify-items: stretch;
        }

        .battery-picker-wrap {
          width: 100%;
        }

        .test-dashboard {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .test-score-panel {
          position: static;
        }
      }

      @media (max-width: 560px) {
        .sidebar {
          width: min(310px, calc(100vw - 34px));
          padding: 20px 16px;
        }

        .brand {
          font-size: 1.12rem;
        }

        .domain-button {
          min-height: 52px;
          padding: 9px 11px;
        }

        .domain-number {
          font-size: 0.72rem;
        }

        .domain-title {
          font-size: 0.92rem;
        }

        .main {
          padding: 12px;
        }

        .toolbar {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 8px;
          margin: -12px -12px 12px;
          padding: 10px 12px;
        }

        .search {
          min-height: 40px;
        }

        .action-button {
          width: 100%;
          min-height: 40px;
          padding: 0 10px;
        }

        .toolbar > .action-button {
          grid-column: span 1;
        }

        .content-panel {
          border-right: 0;
          border-left: 0;
          border-radius: 0;
          box-shadow: none;
          margin: 0 -12px;
        }

        .domain-header {
          padding-top: 22px;
          padding-bottom: 18px;
        }

        .domain-header h1 {
          font-size: 1.62rem;
        }

        .domain-meta {
          font-size: 0.94rem;
        }

        .document {
          padding-top: 4px;
          padding-bottom: 30px;
        }

        .lesson {
          padding-top: 20px;
          scroll-margin-top: 76px;
        }

        .markdown h1 {
          font-size: 1.42rem;
        }

        .markdown h2 {
          font-size: 1.24rem;
        }

        .markdown h3 {
          font-size: 1.08rem;
        }

        .markdown ul {
          margin-left: 18px;
        }

        .empty-state,
        .error-state,
        .loading-state {
          padding: 34px 20px;
        }

        .test-panel {
          padding: 20px 16px 30px;
        }

        .test-topbar {
          gap: 16px;
          padding: 18px;
        }

        .test-heading h1 {
          font-size: 1.9rem;
          line-height: 1.05;
        }

        .battery-picker-trigger {
          min-height: 48px;
          padding: 0 12px;
        }

        .battery-picker-popover {
          position: fixed;
          top: 112px;
          right: 12px;
          left: 12px;
          width: auto;
          max-height: calc(100vh - 136px);
          overflow-y: auto;
        }

        .test-progress {
          grid-template-columns: 1fr;
        }

        .test-dashboard {
          grid-template-columns: 1fr;
        }

        .battery-picker-popover {
          left: 12px;
          right: 12px;
          width: auto;
        }

        .option-item {
          grid-template-columns: auto auto minmax(0, 1fr);
          align-items: start;
          padding: 12px;
        }

        .question-card {
          padding: 18px;
        }

        .question-title {
          font-size: 1.16rem;
        }

        .test-actions {
          justify-content: stretch;
        }

        .test-actions .action-button {
          flex: 1 1 150px;
        }
      }

      @media print {
        .sidebar,
        .menu-toggle,
        .menu-backdrop,
        .toolbar {
          display: none;
        }

        .app-shell {
          display: block;
        }

        .main {
          padding: 0;
        }

        .content-panel {
          border: 0;
          box-shadow: none;
        }

        .lesson {
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside id="domainSidebar" class="sidebar" aria-label="Menu de dominios">
        <h1 class="brand">ISC2 CC</h1>
        <nav id="domainMenu" class="domain-menu" aria-label="Dominios"></nav>
        <div class="sidebar-section">
          <button id="testMenuButton" class="sidebar-action" type="button">Tests</button>
        </div>
        <section class="toc" aria-label="Indice del dominio">
          <p class="toc-title">Indice</p>
          <ol id="tocList" class="toc-list"></ol>
        </section>
      </aside>
      <button id="menuBackdrop" class="menu-backdrop" type="button" aria-label="Cerrar menu"></button>

      <main class="main">
        <div class="toolbar">
          <button id="menuToggle" class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="domainSidebar" aria-expanded="false">
            <span class="menu-toggle-lines" aria-hidden="true"></span>
          </button>
          <input id="searchInput" class="search" type="search" placeholder="Buscar en el dominio actual" autocomplete="off">
          <button id="epubButton" class="action-button" type="button">EPUB completo</button>
          <button id="printButton" class="action-button" type="button">Imprimir</button>
        </div>

        <section id="content" class="content-panel" aria-live="polite">
          <div class="empty-state">Selecciona un dominio para ver el contenido completo.</div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
